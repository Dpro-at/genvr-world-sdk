<!doctype html><meta charset="utf-8"><title>Tidewater installed material lighting GPU check</title>

<script type="module">

 light.position.z=2;lights.update(camera,.016,0);const dayPixel=center(await pixels());

 let bounceCpuError=0,nearestEight=true;for(let i=0;i<16;i++){
  const index=i%4,normal=index===0?[0,-1,0]:index===1?[0,1,0]:[0,0,1];

  for(let c=0;c<3;c++)bounceCpuError=Math.max(bounceCpuError,Math.abs(sample[(i+16)*4+c]-expected[c]));

 localInstalled:localPixel[0]>dayPixel[0]+10&&localPixel[0]>backPixel[0]+10,bayerComplement,red,green,holes,restored};
