<script type="module">
import * as T from 'three/webgpu';

for(let i=0;i<maskPixels.length;i+=4)if(T.DataUtils.fromHalfFloat(maskPixels[i+1])>.5){waterPixels++;waterVelocity=Math.max(waterVelocity,Math.abs(T.DataUtils.fromHalfFloat(velocityPixels[i])),Math.abs(T.DataUtils.fromHalfFloat(velocityPixels[i+1])));}

 await r.resolveTimestampsAsync('compute');await r.resolveTimestampsAsync('render');draw();await r.backend.device.queue.onSubmittedWorkDone();const compute=await r.resolveTimestampsAsync('compute'),render=await r.resolveTimestampsAsync('render');stageTimings[name]={compute:['scene','beauty','final'].includes(name)?0:compute,render:['scene','beauty','final','ao'].includes(name)?render:0};}

const shadowSun=new T.DirectionalLight();shadowSun.shadow.shadowNode={lights:[0,1,2].map(()=>{const light=new T.DirectionalLight();light.shadow.map=shadowTarget;return light;})};
const probeCamera=new T.PerspectiveCamera();probeCamera.updateMatrixWorld(true);
const hard=hazeShadowProvider(shadowSun,probeCamera);const probe=new PostPass(r,T.TSL.vec4(hard(T.TSL.vec3(.5,.25,.5)),hard(T.TSL.vec3(.5,.75,.5)),0,1),'shadow-probe',2,2);probe.update();

 heightNode:xz=>xz.x.greaterThan(16).and(xz.x.lessThan(50)).select(n.float(100),n.float(0)),normalNode:()=>n.vec3(0,1,0),albedoNode:()=>n.vec3(.3),sunDirection:n.uniform(new T.Vector3(1,1,0).normalize()),sunColor:n.uniform(new T.Vector3(1,1,1)),seaLevel:n.uniform(-100)});

}
