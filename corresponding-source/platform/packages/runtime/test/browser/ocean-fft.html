<!doctype html>
<meta charset="utf-8" />
<title>Ocean FFT check</title>
<script type="importmap">
  { "imports": { "three/webgpu": "/node_modules/three/build/three.webgpu.js", "three": "/node_modules/three/build/three.webgpu.js" } }
</script>
<script type="module">
  // Plan task 1: the TSL compute FFT against the CPU reference (5 single waves, max error < 1e-4), plus timing.
  import { WebGPURenderer } from 'three/webgpu';
  import { OceanFFT } from '/dist/ocean/ocean-fft.js';
  import { FFT_SIZE, oceanFieldsCpu, singleWaveSpectrum } from '/dist/ocean/ocean-spectrum.js';

  async function run() {
    const renderer = new WebGPURenderer();
    await renderer.init();
    if (!renderer.backend.isWebGPUBackend) return { error: 'not WebGPU' };
    const N = FFT_SIZE;
    const waves = [
      { cascade: 0, dx: 1, dy: 0, amplitude: 0.8, phase: 0 },
      { cascade: 0, dx: -3, dy: 5, amplitude: 0.3, phase: 1.1 },
      { cascade: 1, dx: 7, dy: -2, amplitude: 0.25, phase: 2.0 },
      { cascade: 2, dx: 20, dy: 33, amplitude: 0.05, phase: -0.7 },
      { cascade: 3, dx: -60, dy: 41, amplitude: 0.01, phase: 0.3 },
    ];
    const spectrum = singleWaveSpectrum(waves);
    const fft = new OceanFFT({ spectrum, readback: true });
    const time = 3.7;
    fft.time.value = time;
    fft.dt.value = 0;
    fft.dispatch(renderer);
    const disp = new Float32Array(await renderer.getArrayBufferAsync(fft.readbackDisplacement));
    const deriv = new Float32Array(await renderer.getArrayBufferAsync(fft.readbackDerivatives));
    let maxErr = 0;
    let maxValue = 0;
    for (let c = 0; c < 4; c += 1) {
      const ref = oceanFieldsCpu(spectrum.h0, spectrum.waves, c, time, 0.9);
      for (let i = 0; i < N * N; i += 1) {
        const g = c * N * N + i;
        for (let k = 0; k < 3; k += 1) {
          maxErr = Math.max(maxErr, Math.abs(disp[g * 4 + k] - ref.displacement[i * 3 + k]));
          maxValue = Math.max(maxValue, Math.abs(ref.displacement[i * 3 + k]));
        }
        for (let k = 0; k < 4; k += 1) maxErr = Math.max(maxErr, Math.abs(deriv[g * 4 + k] - ref.derivatives[i * 4 + k]));
      }
    }
    fft.dispose();

    // Timing: the real sea, 4 cascades, the two passes alone, averaged over many frames.
    const sea = new OceanFFT();
    for (let i = 0; i < 5; i += 1) sea.update(renderer, 1 / 60);
    const device = renderer.backend.device;
    await device.queue.onSubmittedWorkDone();
    const frames = 200;
    const t0 = performance.now();
    for (let i = 0; i < frames; i += 1) sea.update(renderer, 1 / 60);
    await device.queue.onSubmittedWorkDone();
    const ms = (performance.now() - t0) / frames;
    sea.dispose();
    return { maxErr, maxValue, fftMsPerFrame: ms };
  }
  run().then((r) => (window.__result = r), (e) => (window.__result = { error: String(e && e.stack || e) }));
</script>
