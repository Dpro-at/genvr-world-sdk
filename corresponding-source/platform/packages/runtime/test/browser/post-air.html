<script type="module">

 await step();const analytic=await probe(haze.texture);let analyticError=0;

  const v=new Vector4(uv[0]*2-1,1-uv[1]*2,Math.min(depths[p],.999999),1).applyMatrix4(camera.projectionMatrixInverse);v.multiplyScalar(1/v.w);

  for(let c=0;c<3;c++)analyticError=Math.max(analyticError,Math.abs(analytic[p+c]-(rgba[p+c]*(1-scatter)+[.6,.7,.8][c]*scatter)));}
 camera.setViewOffset(W,H,2,1,W,H);await step();const jittered=await probe(haze.texture);let unjitteredError=0;for(let i=0;i<analytic.length;i++)unjitteredError=Math.max(unjitteredError,Math.abs(analytic[i]-jittered[i]));camera.clearViewOffset();

 const low=await probe(haze.low);const lowFinite=low.every(Number.isFinite);const historyActive=haze.historyValid.value===0;
 const lx=5,ly=16,uv=[(lx+.5)/32,(ly+.5)/32],d=depths[((ly*2+1)*W+lx*2+1)*4];
 const v=new Vector4(uv[0]*2-1,1-uv[1]*2,d,1).applyMatrix4(camera.projectionMatrixInverse);v.multiplyScalar(1/v.w);const distance=Math.hypot(v.x,v.y,v.z);
 const fract=x=>x-Math.floor(x);const jit=fract(fract(52.9829189*fract((lx+.5)*.06711056+(ly+.5)*.00583715))+haze.frame.value*.61803398875);
 const cpuMarch=marchHaze(10,v.y/distance,distance,jit,()=>0),marchError=Math.abs(low[(ly*32+lx)*4+1]-cpuMarch[1]);
 await step();const temporalActive=haze.historyValid.value===1;
 haze.godRays=true;visibility.value=1;haze.invalidate();await step();const rays=await probe(haze.godRayTextures[3]);const raysFinite=rays.every(Number.isFinite);
 const rayPeak=Math.max(...rays.filter((_,i)=>i%4===0));
 // Actual scene depth texture checks (not only float depth inputs): corner + near box.

 const plane=new Mesh(new PlaneGeometry(20,20),material);plane.position.set(0,10,-5);scene.add(plane);

 const gtao=new GTAO(target.depthTexture,camera,{inputTexture:target.texture});gtao.resize(W,H);await new Promise(requestAnimationFrame);gtao.update(renderer);await renderer.backend.device.queue.onSubmittedWorkDone();
 const aoValues=await probe(gtao.texture),aoFinite=aoValues.every(Number.isFinite),aoMinimum=Math.min(...aoValues.filter((_,i)=>i%4===0));

 const actualHaze=new AirHaze({inputTexture:target.texture,depthTexture:target.depthTexture,camera,sunDirectionNode:sun,sunColorNode:sunColor,seaLevelNode:TSL.uniform(0),skyLuminanceNode:()=>TSL.vec3(.6,.7,.8),skyIrradianceNode:TSL.vec3(.5)});
 actualHaze.resize(W,H);await new Promise(requestAnimationFrame);actualHaze.update(renderer);const actualDepthFinite=(await probe(actualHaze.texture)).every(Number.isFinite);actualHaze.dispose();

 gtao.resize(65,67);await new Promise(requestAnimationFrame);gtao.update(renderer);
 const oddAO=await probe(gtao.colorTexture),oddSizeFinite=oddAO.every(Number.isFinite)&&oddAO.at(-1)===1;
 const timedHaze=new AirHaze({inputTexture:target.texture,depthTexture:target.depthTexture,camera,sunDirectionNode:sun,sunColorNode:sunColor,seaLevelNode:TSL.uniform(0),skyLuminanceNode:()=>TSL.vec3(.6,.7,.8),skyIrradianceNode:TSL.vec3(.5),shadowNode:()=>TSL.float(.5)});
 timedHaze.resize(65,67);timedHaze.update(renderer);const oddHaze=await probe(timedHaze.texture),oddHazeFinite=oddHaze.every(Number.isFinite)&&oddHaze.at(-1)===1;
 target.setSize(2560,1440);camera.aspect=2560/1440;camera.updateProjectionMatrix();renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.setRenderTarget(null);
 gtao.resize(2560,1440);timedHaze.resize(2560,1440);const aoGpuMs=[],hazeGpuMs=[];
 for(let i=0;i<4;i++){await new Promise(requestAnimationFrame);gtao.update(renderer);await renderer.backend.device.queue.onSubmittedWorkDone();const a=await renderer.resolveTimestampsAsync('compute');

 haze.dispose();haze.dispose();gtao.dispose();gtao.dispose();const frame=haze.frame.value;haze.update(renderer);const disposed=haze.frame.value===frame;
 const pass=analyticError<.004&&unjitteredError===0&&disabledError<.001&&underwaterError<.001&&mediumError<.001&&marchError<.005&&shaftDifference>.001&&lowFinite&&historyActive&&temporalActive&&raysFinite&&rayPeak>0&&aoFinite&&aoMinimum<.95&&actualDepthFinite&&resized&&disposed&&oddSizeFinite&&oddHazeFinite;
 window.__result={analyticError,unjitteredError,disabledError,underwaterError,mediumError,marchError,shaftDifference,lowFinite,historyActive,temporalActive,raysFinite,rayPeak,aoFinite,aoMinimum,actualDepthFinite,resized,disposed,oddSizeFinite,oddHazeFinite,aoGpuMs,hazeGpuMs,pass};
 renderer.dispose();target.dispose();color.dispose();depth.dispose();medium.dispose();material.dispose();plane.geometry.dispose();box.geometry.dispose();floor.geometry.dispose();
}
